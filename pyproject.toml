[project]
name = "lead-qualification-chatbot"
version = "0.1.0"
description = "AI lead qualification chatbot for a fictional UK estate agency"
readme = "README.md"
authors = [
    { name = "kzr", email = "virajdeshmukh.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.1",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langsmith>=0.14.17",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "phonenumbers>=9.0.43",
    "pydantic-settings>=2.16.3",
    "rapidfuzz>=3.14.6",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
lead-qualification-chatbot = "lead_qualification_chatbot.cli:main"
lead-qualification-evals = "lead_qualification_chatbot.scripts.run_evals:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:ast.Str is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ANN"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]


